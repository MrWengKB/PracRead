<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>朗读评分原型</title>
<script src="https://unpkg.com/pinyin-pro@3.26.0/dist/index.js"></script>
<script src="score.js"></script>
<style>
  body{font-family:system-ui,"PingFang SC","Microsoft YaHei",sans-serif;max-width:760px;margin:0 auto;padding:16px;background:#fafafa;color:#222}
  textarea{width:100%;box-sizing:border-box;font-size:18px;min-height:90px;padding:8px}
  button{font-size:16px;padding:8px 16px;margin:8px 8px 8px 0;cursor:pointer}
  .status{color:#666;white-space:pre-wrap;min-height:1.5em}
  .heard{background:#fff;border:1px solid #ddd;padding:8px;min-height:1.5em}
  .result{font-size:26px;line-height:2.4;letter-spacing:2px}
  .c{display:inline-block;text-align:center;padding:0 2px;border-radius:4px;position:relative}
  .c small{display:block;font-size:11px;line-height:1;color:#666}
  .ok{background:#d9f5dd}.tone{background:#fff1bf}.wrong{background:#ffd3d3}.missing{background:#e3e3e3;color:#999;text-decoration:line-through}
  .legend span{display:inline-block;padding:2px 8px;margin-right:6px;border-radius:4px;font-size:13px}
  .score{font-size:20px;margin:8px 0}
</style>
</head>
<body>
<h2>朗读评分原型（浏览器语音识别 + 拼音对齐）</h2>
<p class="status">原理：用浏览器自带的 zh-CN 语音识别把朗读转成文字，再按拼音与原文逐字对齐。它只能判断“读没读对字、漏没漏读”，不能给出真正的发音/声调评分。</p>
<textarea id="target">床前明月光，疑是地上霜。举头望明月，低头思故乡。</textarea>
<div>
  <button id="start">开始朗读</button>
  <button id="stop" disabled>结束并评分</button>
</div>
<div class="status" id="status"></div>
<p>识别到的文字：</p>
<div class="heard" id="heard"></div>
<div class="score" id="score"></div>
<div class="legend">
  <span class="ok">读对</span><span class="tone">音对调不同</span><span class="wrong">读错</span><span class="missing">漏读</span>
</div>
<div class="result" id="result"></div>

<script>
const $ = (s) => document.querySelector(s);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let rec = null, finalText = "", interim = "", running = false;

if (!SR) {
  $("#status").textContent = "当前浏览器不支持语音识别（Firefox 不支持；请用 Chrome、Edge 或 Safari）。";
  $("#start").disabled = true;
}

function start() {
  finalText = ""; interim = ""; $("#heard").textContent = ""; $("#result").innerHTML = ""; $("#score").textContent = "";
  rec = new SR();
  rec.lang = "zh-CN";
  rec.continuous = true;
  rec.interimResults = true;
  rec.onresult = (e) => {
    interim = "";
    for (let i = e.resultIndex; i < e.results.length; i++) {
      if (e.results[i].isFinal) finalText += e.results[i][0].transcript;
      else interim += e.results[i][0].transcript;
    }
    $("#heard").textContent = finalText + interim;
  };
  rec.onerror = (e) => { $("#status").textContent = "识别出错：" + e.error; };
  // 有些浏览器停顿后会自动结束，用户没点结束就重新开始
  rec.onend = () => { if (running) { try { rec.start(); } catch (_) {} } else score(); };
  running = true;
  rec.start();
  $("#status").textContent = "正在听…";
  $("#start").disabled = true; $("#stop").disabled = false;
}

function stop() {
  running = false;
  $("#stop").disabled = true; $("#start").disabled = false;
  $("#status").textContent = "处理中…";
  rec.stop();
}

function score() {
  const heard = finalText + interim;
  const r = ReadScore.alignAndScore($("#target").value, heard, pinyinPro.pinyin);
  $("#status").textContent = "";
  $("#score").textContent = `准确度 ${r.accuracy} 分 · 完整度 ${r.completeness}%（读对 ${r.ok}，声调可疑 ${r.tone}，读错 ${r.wrong}，漏读 ${r.missing}，多读 ${r.extra}）`;
  const box = $("#result"); box.innerHTML = "";
  for (const p of r.perChar) {
    const el = document.createElement("span");
    el.className = "c " + p.status;
    el.title = p.status === "ok" ? "" : `应读 ${p.py}，听到 ${p.heard || "（无）"} ${p.heardPy}`;
    const sm = document.createElement("small");
    sm.textContent = p.status === "ok" || p.status === "missing" ? " " : (p.heard || "");
    el.appendChild(sm);
    el.appendChild(document.createTextNode(p.ch));
    box.appendChild(el);
  }
}

$("#start").onclick = start;
$("#stop").onclick = stop;
</script>
</body>
</html>
